# Render Blueprint: one API (Django + gunicorn) and one static site (React build).
# Create it from the Render dashboard: New > Blueprint > pick this repository.
# Values marked `sync: false` are asked for during setup (see docs/DEPLOYMENT.md).
services:
  - type: web
    name: truck-routing-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn config.wsgi:application --bind 0.0.0.0:$PORT --workers 2 --threads 4 --timeout 120
    healthCheckPath: /api/health/
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.7
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: CORS_ALLOWED_ORIGINS # the static site's URL, e.g. https://truck-routing-web.onrender.com
        sync: false
      - key: ORS_API_KEY # https://openrouteservice.org/dev/#/signup
        sync: false

  - type: web
    name: truck-routing-web
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL # the API's URL, e.g. https://truck-routing-api.onrender.com (no trailing slash)
        sync: false
