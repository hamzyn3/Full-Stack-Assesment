# Run the whole app locally in containers:  docker compose up --build
#   frontend -> http://localhost:8080      backend -> http://localhost:8000
# Needs backend/.env with ORS_API_KEY (copy backend/.env.example).
# Vercel does not use any of this; it builds from source (see docs/DEPLOYMENT.md).
services:
  backend:
    build: ./backend
    env_file: backend/.env
    environment:
      DEBUG: "False"
      SECRET_KEY: local-compose-only-change-me
      ALLOWED_HOSTS: localhost,127.0.0.1
      CORS_ALLOWED_ORIGINS: http://localhost:8080
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:8000
    ports:
      - "8080:80"
    depends_on:
      - backend
